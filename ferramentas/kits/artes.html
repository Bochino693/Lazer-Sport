<!doctype html>
<!--
  As artes de capa dos kits eletrônicos (LEIA-ME-V10, seções 105 e 107).

  O dono pediu: a TV ao fundo "para demonstrar" o jogo, em pé ("esses 3 jogos
  são tela vertical"), sem "o fundo com zoom do jogo", e "não coloque itens
  fictícios" -- os itens do kit só entram com FOTO REAL (ferramentas/kits/
  itens/<chave>.webp). Enquanto a foto de um item não chega, ele aparece só
  pelo nome na lista; nada de desenho inventado.

  A TELA da TV é a captura de verdade do nosso jogo rodando
  (ferramentas/kits/telas/<jogo>.webp, 720 x 1280).

  O TOPO E O PÉ FICAM LIVRES: no card do site moram ali o selo "KIT", os
  botões de curtir/favoritar (topo, até ~22% no celular) e o selo "Sob
  consulta / À venda" (pé, de ~86% a ~97% da altura, até ~56% da largura no
  celular). Nada de texto nessas faixas.

  Uso: node ferramentas/kits/gerar.js <pasta>  (serve o repositório por HTTP,
  abre esta página com ?kit=<chave> e fotografa 1200 x 1200).
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arte do kit</title>
<link rel="stylesheet" href="/core/static/vendor/fontawesome/css/all.min.css">
<style>
@font-face { font-family: "Poppins"; font-weight: 600; src: url("/core/static/vendor/fontes/poppins-latin-600-normal.woff2"); }
@font-face { font-family: "Poppins"; font-weight: 700; src: url("/core/static/vendor/fontes/poppins-latin-700-normal.woff2"); }
@font-face { font-family: "Poppins"; font-weight: 800; src: url("/core/static/vendor/fontes/poppins-latin-800-normal.woff2"); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1200px; background: #050b1c; overflow: hidden; }

.arte {
  position: relative;
  width: 1200px;
  height: 1200px;
  overflow: hidden;
  font-family: "Poppins", sans-serif;
  color: #fff;
  background:
    radial-gradient(ellipse 55% 50% at 30% 58%, var(--cor-brilho), transparent 70%),
    radial-gradient(ellipse 60% 40% at 85% 20%, rgba(47, 139, 255, .18), transparent 70%),
    linear-gradient(180deg, #0a1430 0%, #070f24 55%, #040915 100%);
}

/* o chão do estúdio: um brilho e linhas de fuga discretas */
.chao {
  position: absolute;
  left: -10%;
  right: -10%;
  top: 905px;
  height: 320px;
  background:
    radial-gradient(ellipse 45% 40% at 32% 10%, rgba(255, 255, 255, .10), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 90px);
  transform: perspective(600px) rotateX(58deg);
  transform-origin: top center;
}

#palco {
  position: absolute;
  left: 20px;
  top: 262px;
  width: 600px;
  height: 760px;
}

.texto {
  position: absolute;
  left: 640px;
  right: 52px;
  top: 300px;
}

.selo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--cor-destaque), var(--cor-destaque-2));
  color: #160f00;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: .08em;
}

h1 {
  margin-top: 18px;
  font-weight: 800;
  font-size: 74px;
  line-height: .98;
  letter-spacing: -.015em;
}

h1 span {
  display: block;
  background: linear-gradient(180deg, var(--cor-destaque), var(--cor-destaque-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.jogo {
  margin-top: 14px;
  font-weight: 600;
  font-size: 26px;
  color: #dbe6ff;
}

.jogo b { color: var(--cor-destaque); font-weight: 800; }

.vem {
  margin-top: 30px;
  padding: 22px 24px 18px;
  border: 2px solid rgba(255, 255, 255, .12);
  border-radius: 26px;
  background: linear-gradient(160deg, rgba(30, 58, 120, .55), rgba(10, 20, 48, .7));
}

.vem h2 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #9fc4ff;
}

.vem ul { list-style: none; margin-top: 12px; display: grid; gap: 9px; }

.vem li {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 24px;
  line-height: 1.15;
}

.vem li i {
  flex: none;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--cor-destaque);
  color: #160f00;
  font-size: 15px;
}

.pronto {
  margin-top: 18px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 22px;
  color: #8df5bd;
  letter-spacing: .02em;
}

/* a marca no canto de baixo à direita (o selo do card fica à esquerda) */
.marca {
  position: absolute;
  right: 48px;
  bottom: 46px;
  display: grid;
  place-items: center;
  width: 150px;
  height: 96px;
  padding: 10px 12px;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .45);
}

.marca img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div class="arte" id="arte">
  <div class="chao"></div>
  <canvas id="palco" width="600" height="760"></canvas>
  <div class="texto">
    <span class="selo"><i class="fa-solid fa-microchip"></i> KIT ELETRÔNICO</span>
    <h1 id="titulo"></h1>
    <p class="jogo" id="jogo"></p>
    <div class="vem">
      <h2>O que vem no kit</h2>
      <ul id="itens"></ul>
    </div>
    <p class="pronto"><i class="fa-solid fa-circle-check"></i> Pronto para instalar</p>
  </div>
  <span class="marca"><img src="/core/static/images/logo-site.webp" alt=""></span>
</div>
<script type="importmap">
{ "imports": { "three": "/core/static/vendor/three/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "/core/static/vendor/three/RoomEnvironment.js";

const T = "/ferramentas/kits/telas/";
const KITS = {
  "kit-boliche-virtual": {
    titulo: "Kit <span>Boliche Virtual</span>",
    tamanho: 60,
    jogo: "com o jogo <b>Dragon Bowling</b>",
    tela: T + "dragon-bowling.webp",
    destaque: "#ffd23f", destaque2: "#ff9a1f", brilho: "rgba(255, 140, 30, .30)", luz: 0xff9a2a,
    itens: ["TV Box com o jogo", "Barra com 5 sensores", "Webcam", "Placa Zero Delay", "Chicote", "Cabo HDMI", "Fonte"],
  },
  "kit-strike-kids": {
    titulo: "Kit <span>Strike Kids</span>",
    jogo: "com o jogo <b>Strike Kids</b>",
    tela: T + "strike-kids.webp",
    destaque: "#ffe14a", destaque2: "#7ddc3a", brilho: "rgba(110, 220, 70, .26)", luz: 0x7ddc3a,
    itens: ["TV Box com o jogo", "Barra com 5 sensores", "Câmera do ranking", "Placa Zero Delay", "Chicote", "Cabo HDMI", "Fonte"],
  },
  "kit-lazer-shot": {
    titulo: "Kit <span>Lazer Shot</span>",
    jogo: "com o jogo <b>Lazer Shot</b>",
    tela: T + "lazer-shot.webp",
    destaque: "#ff6b7d", destaque2: "#ffb000", brilho: "rgba(255, 40, 60, .28)", luz: 0xff3048,
    itens: ["Arma personalizada", "TV Box com o jogo", "Câmera do ranking", "Placa Zero Delay", "Chicote", "Cabo HDMI", "Fonte"],
  },
};

const chave = new URLSearchParams(location.search).get("kit") || "kit-boliche-virtual";
const kit = KITS[chave];
const arte = document.getElementById("arte");
arte.style.setProperty("--cor-destaque", kit.destaque);
arte.style.setProperty("--cor-destaque-2", kit.destaque2);
arte.style.setProperty("--cor-brilho", kit.brilho);
document.getElementById("titulo").innerHTML = kit.titulo;
if (kit.tamanho) document.getElementById("titulo").style.fontSize = `${kit.tamanho}px`;
document.getElementById("jogo").innerHTML = kit.jogo;
document.getElementById("itens").innerHTML = kit.itens.map((n) => `<li><i class="fa-solid fa-check"></i>${n}</li>`).join("");

// ---------------------------------------------------------------- a TV em pé
const canvas = document.getElementById("palco");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(600, 760, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const cena = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
cena.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
cena.environmentIntensity = 0.6;

const camera = new THREE.PerspectiveCamera(28, 600 / 760, 0.1, 100);
camera.position.set(0.9, 2.6, 12.2);
camera.lookAt(0.05, 2.55, 0);

const luz = new THREE.DirectionalLight(0xffffff, 2.2);
luz.position.set(-3, 7, 6);
luz.castShadow = true;
luz.shadow.mapSize.set(2048, 2048);
luz.shadow.radius = 8;
cena.add(luz);
const contra = new THREE.PointLight(kit.luz, 60, 14, 1.5);
contra.position.set(0, 3, -2.2);
cena.add(contra);
cena.add(new THREE.AmbientLight(0x8aa6d8, 0.3));

function caixa(w, h, d, r = 0.06, b = 0.03) {
  const s = new THREE.Shape();
  const x = w / 2 - b, z = d / 2 - b, rr = Math.max(0.001, Math.min(r, x, z));
  s.moveTo(-x + rr, -z);
  s.lineTo(x - rr, -z); s.absarc(x - rr, -z + rr, rr, -Math.PI / 2, 0, false);
  s.lineTo(x, z - rr); s.absarc(x - rr, z - rr, rr, 0, Math.PI / 2, false);
  s.lineTo(-x + rr, z); s.absarc(-x + rr, z - rr, rr, Math.PI / 2, Math.PI, false);
  s.lineTo(-x, -z + rr); s.absarc(-x + rr, -z + rr, rr, Math.PI, Math.PI * 1.5, false);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, h - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 4, curveSegments: 10 });
  g.translate(0, 0, -(h - 2 * b) / 2);
  g.rotateX(-Math.PI / 2);
  g.computeVertexNormals();
  return g;
}

function textura(url) {
  return new Promise((ok) => new THREE.TextureLoader().load(url, (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; ok(t); }, undefined, () => ok(null)));
}

async function montar() {
  const tv = new THREE.Group();
  // a tela é 9:16 (em pé), como a das máquinas
  const largura = 2.62, altura = 4.66, borda = 0.11;
  const moldura = new THREE.Mesh(caixa(largura + borda * 2, altura + borda * 2, 0.16, 0.06, 0.03),
    new THREE.MeshPhysicalMaterial({ color: 0x07080c, roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.2 }));
  tv.add(moldura);
  const t = await textura(kit.tela);
  const tela = new THREE.Mesh(new THREE.PlaneGeometry(largura, altura), new THREE.MeshBasicMaterial({ map: t, toneMapped: false }));
  tela.position.z = 0.085;
  tv.add(tela);
  const vidro = new THREE.Mesh(new THREE.PlaneGeometry(largura, altura), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.04, transparent: true, opacity: 0.07, clearcoat: 1 }));
  vidro.position.z = 0.09;
  tv.add(vidro);
  const metal = new THREE.MeshStandardMaterial({ color: 0x1b1f29, roughness: 0.38, metalness: 1 });
  const pe = new THREE.Mesh(caixa(0.42, 0.95, 0.12, 0.04, 0.02), metal);
  pe.position.set(0, -(altura / 2 + borda) - 0.42, -0.1);
  tv.add(pe);
  const base = new THREE.Mesh(caixa(1.5, 0.07, 0.8, 0.14, 0.02), metal);
  base.position.set(0, -(altura / 2 + borda) - 0.9, 0.06);
  tv.add(base);
  tv.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  tv.position.set(0, altura / 2 + borda + 0.93, 0);
  tv.rotation.y = 0.24;
  cena.add(tv);

  const chao = new THREE.Mesh(new THREE.CircleGeometry(4.2, 64), new THREE.ShadowMaterial({ opacity: 0.45 }));
  chao.rotation.x = -Math.PI / 2;
  chao.receiveShadow = true;
  cena.add(chao);
  renderer.render(cena, camera);
}

window.PRONTO = Promise.all([document.fonts.ready, montar()]).then(() => new Promise((ok) => requestAnimationFrame(() => ok(true))));
</script>
</body>
</html>
