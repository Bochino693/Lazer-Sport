<!doctype html>
<!--
  As artes de capa dos kits eletrônicos (LEIA-ME-V10, seção 105).

  Feitas SÓ com as artes dos nossos jogos (logo, cena e personagens de
  core/static/site/arena/) e os itens do kit. O dono: "vc nao deve usar essa
  imagem, vc deve criar uma para o strike kids e dragon bowling, com as artes
  do jogo, essa image é de outro site." Nada de arte de terceiros aqui.

  Uso: node ferramentas/kits/gerar.js  (abre esta página com ?kit=<chave>,
  fotografa 1200x1200 e grava core/static/site/kits/<chave>.webp).
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arte do kit</title>
<link rel="stylesheet" href="../../core/static/vendor/fontawesome/css/all.min.css">
<style>
@font-face { font-family: "Poppins"; font-weight: 600; src: url("../../core/static/vendor/fontes/poppins-latin-600-normal.woff2"); }
@font-face { font-family: "Poppins"; font-weight: 700; src: url("../../core/static/vendor/fontes/poppins-latin-700-normal.woff2"); }
@font-face { font-family: "Poppins"; font-weight: 800; src: url("../../core/static/vendor/fontes/poppins-latin-800-normal.woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 700; src: url("../../core/static/site/arena/jogos/strike-kids/fredoka_700.ttf"); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1200px; background: #050b1c; overflow: hidden; }

.arte {
  position: relative;
  width: 1200px;
  height: 1200px;
  overflow: hidden;
  font-family: "Poppins", sans-serif;
  color: #fff;
  background: #050b1c;
}

/* a cena do jogo, cheia, atrás de tudo */
.fundo {
  position: absolute;
  inset: 0;
  background-position: center top;
  background-size: cover;
  transform: scale(1.04);
  filter: saturate(1.15);
}

/* véu: a cena aparece em cima e escurece embaixo, onde ficam os itens */
.veu {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 30%, transparent 0 34%, rgba(5, 11, 28, .35) 62%),
    linear-gradient(180deg, rgba(5, 11, 28, .25) 0%, rgba(5, 11, 28, .05) 22%, rgba(5, 11, 28, .55) 48%, rgba(5, 11, 28, .94) 64%, #050b1c 100%);
}

/* brilho na cor do jogo */
.brilho {
  position: absolute;
  left: 50%;
  top: 424px;
  width: 900px;
  height: 520px;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, var(--cor-brilho), transparent);
  opacity: .55;
  filter: blur(10px);
}

.topo {
  position: absolute;
  top: 44px;
  left: 52px;
  right: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.selo {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 14px 26px 14px 20px;
  border-radius: 999px;
  background: linear-gradient(135deg, #ffd23f, #ffb000);
  color: #1b1300;
  font-weight: 800;
  font-size: 26px;
  letter-spacing: .08em;
  box-shadow: 0 12px 30px rgba(255, 184, 0, .35);
}

.selo i { font-size: 28px; }

.marca {
  display: grid;
  place-items: center;
  width: 196px;
  height: 130px;
  padding: 12px 16px;
  border-radius: 26px;
  background: #fff;
  box-shadow: 0 14px 34px rgba(0, 0, 0, .45);
}

.marca img { max-width: 100%; max-height: 100%; }

/* O TOPO FICA LIVRE: no card do site moram ali o selo "KIT" e os botões de
   curtir e favoritar -- no celular eles ocupam até ~22% da altura (264 px
   aqui). Nada da arte pode ficar por baixo deles: o herói começa em ~284. */

/* o herói: o logo/ícone do jogo */
.heroi {
  position: absolute;
  left: 50%;
  top: 424px;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
}

.heroi img { display: block; filter: drop-shadow(0 24px 40px rgba(0, 0, 0, .6)); }

.heroi--icone img {
  width: 280px;
  height: 280px;
  border-radius: 60px;
  box-shadow: 0 0 0 6px rgba(255, 255, 255, .9), 0 0 80px var(--cor-brilho), 0 30px 60px rgba(0, 0, 0, .55);
}

.heroi--logo img { width: 640px; }

/* personagens do jogo dos dois lados do logo */
.personagem {
  position: absolute;
  top: 300px;
  width: 300px;
  filter: drop-shadow(0 20px 30px rgba(0, 0, 0, .55));
}

.personagem--esq { left: 26px; transform: rotate(-6deg); }
.personagem--dir { right: 26px; transform: rotate(6deg); }

.titulo {
  position: absolute;
  top: 586px;
  left: 0;
  right: 0;
  text-align: center;
}

.titulo h1 {
  font-weight: 800;
  font-size: 92px;
  line-height: 1;
  letter-spacing: -.01em;
  text-shadow: 0 8px 30px rgba(0, 0, 0, .65);
}

.titulo h1 span { color: var(--cor-destaque); }

.titulo p {
  margin-top: 16px;
  font-weight: 600;
  font-size: 34px;
  color: #dbe7ff;
}

.titulo p b { color: var(--cor-destaque); font-weight: 800; }

/* os itens do kit */
.itens {
  position: absolute;
  left: 52px;
  right: 52px;
  top: 790px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  list-style: none;
}

.itens li {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 128px;
  padding: 14px 10px;
  border: 2px solid rgba(255, 255, 255, .14);
  border-radius: 24px;
  background: linear-gradient(160deg, rgba(34, 64, 128, .72), rgba(12, 24, 56, .88));
  text-align: center;
  font-weight: 700;
  font-size: 23px;
  line-height: 1.15;
}

.itens li i {
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  border-radius: 18px;
  background: var(--cor-icone, #2f8bff);
  color: #fff;
  font-size: 28px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
}

.itens li:nth-child(8n+1) i { --cor-icone: linear-gradient(135deg, #2f8bff, #1d56c0); }
.itens li:nth-child(8n+2) i { --cor-icone: linear-gradient(135deg, #ff5a6e, #d81b3c); }
.itens li:nth-child(8n+3) i { --cor-icone: linear-gradient(135deg, #22c55e, #0f8a43); }
.itens li:nth-child(8n+4) i { --cor-icone: linear-gradient(135deg, #ffb000, #f07800); }
.itens li:nth-child(8n+5) i { --cor-icone: linear-gradient(135deg, #a855f7, #6d28d9); }
.itens li:nth-child(8n+6) i { --cor-icone: linear-gradient(135deg, #14c8d8, #0e7c9a); }
.itens li:nth-child(8n+7) i { --cor-icone: linear-gradient(135deg, #ff7a3d, #e63946); }

/* o último cartão: o fecho "pronto para instalar" */
.itens li.fecho {
  border-color: transparent;
  background: linear-gradient(135deg, var(--cor-destaque), var(--cor-destaque-2));
  color: #1b1300;
  font-size: 22px;
  font-weight: 800;
}

.itens li.fecho i { background: rgba(0, 0, 0, .18); box-shadow: none; }

.faixa {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 96px;
  padding: 0 40px 0 22px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 26px;
  background: linear-gradient(90deg, #e63946, #ff6b3d 50%, #e63946);
  font-weight: 800;
  font-size: 27px;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.faixa i { font-size: 26px; margin-right: 10px; }
.faixa-texto { flex: 1; text-align: center; }
.faixa .marca { width: 118px; height: 74px; padding: 8px 10px; border-radius: 18px; box-shadow: 0 8px 20px rgba(0, 0, 0, .35); }
</style>
</head>
<body>
<div class="arte" id="arte">
  <div class="fundo" id="fundo"></div>
  <div class="veu"></div>
  <div class="brilho"></div>
  <div id="personagens"></div>
  <div class="heroi" id="heroi"></div>
  <div class="titulo">
    <h1 id="titulo"></h1>
    <p id="sub"></p>
  </div>
  <ul class="itens" id="itens"></ul>
  <div class="faixa">
    <span class="marca"><img src="../../core/static/images/logo-site.webp" alt=""></span>
    <span class="faixa-texto"><i class="fa-solid fa-microchip"></i> Kit eletrônico · a eletrônica completa da máquina</span>
  </div>
</div>
<script>
const A = "../../core/static/site/arena/";
const KITS = {
  "kit-boliche-virtual": {
    fundo: A + "capas/topo/dragon-bowling-estreito.webp",
    heroi: { tipo: "icone", src: A + "capas/dragon-bowling.webp" },
    titulo: 'Kit <span>Boliche Virtual</span>',
    sub: 'com o jogo <b>Dragon Bowling</b>',
    destaque: "#ffc93c", destaque2: "#ff9a1f", brilho: "rgba(255, 150, 30, .9)",
    itens: [
      ["fa-tv", "TV Box com o jogo"],
      ["fa-wave-square", "Barra com 5 sensores"],
      ["fa-video", "Webcam"],
      ["fa-microchip", "Placa Zero Delay"],
      ["fa-network-wired", "Chicote"],
      ["fa-ethernet", "Cabo HDMI"],
      ["fa-plug", "Fonte"],
    ],
  },
  "kit-strike-kids": {
    fundo: A + "capas/topo/strike-kids-estreito.webp",
    heroi: { tipo: "logo", src: A + "capas/strike-kids-logo.webp" },
    titulo: 'Kit <span>Strike Kids</span>',
    sub: 'com o jogo <b>Strike Kids</b> e os amigos Bob e Mia',
    destaque: "#ffe14a", destaque2: "#7ddc3a", brilho: "rgba(120, 230, 70, .85)",
    itens: [
      ["fa-tv", "TV Box com o jogo"],
      ["fa-wave-square", "Barra com 5 sensores"],
      ["fa-camera", "Câmera do ranking"],
      ["fa-microchip", "Placa Zero Delay"],
      ["fa-network-wired", "Chicote"],
      ["fa-ethernet", "Cabo HDMI"],
      ["fa-plug", "Fonte"],
    ],
  },
  "kit-lazer-shot": {
    fundo: A + "capas/topo/lazer-shot-estreito.webp",
    heroi: { tipo: "icone", src: A + "capas/lazer-shot.webp" },
    titulo: 'Kit <span>Lazer Shot</span>',
    sub: 'com o jogo <b>Lazer Shot</b> e a arma personalizada',
    destaque: "#ff5a6e", destaque2: "#ffb000", brilho: "rgba(255, 40, 60, .85)",
    itens: [
      ["fa-crosshairs", "Arma personalizada"],
      ["fa-tv", "TV Box com o jogo"],
      ["fa-camera", "Câmera do ranking"],
      ["fa-microchip", "Placa Zero Delay"],
      ["fa-network-wired", "Chicote"],
      ["fa-ethernet", "Cabo HDMI"],
      ["fa-plug", "Fonte"],
    ],
  },
};

const chave = new URLSearchParams(location.search).get("kit") || "kit-boliche-virtual";
const kit = KITS[chave];
const arte = document.getElementById("arte");
arte.style.setProperty("--cor-destaque", kit.destaque);
arte.style.setProperty("--cor-destaque-2", kit.destaque2);
arte.style.setProperty("--cor-brilho", kit.brilho);
document.getElementById("fundo").style.backgroundImage = `url("${kit.fundo}")`;
const heroi = document.getElementById("heroi");
heroi.classList.add(`heroi--${kit.heroi.tipo}`);
heroi.innerHTML = `<img src="${kit.heroi.src}" alt="">`;
document.getElementById("titulo").innerHTML = kit.titulo;
document.getElementById("sub").innerHTML = kit.sub;
document.getElementById("itens").innerHTML =
  kit.itens.map(([icone, nome]) => `<li><i class="fa-solid ${icone}"></i>${nome}</li>`).join("") +
  '<li class="fecho"><i class="fa-solid fa-circle-check"></i>Pronto para instalar</li>';
window.PRONTO = Promise.all([
  document.fonts.ready,
  ...[...document.images].map((img) => img.decode().catch(() => {})),
  new Promise((ok) => { const i = new Image(); i.onload = i.onerror = ok; i.src = kit.fundo; }),
]);
</script>
</body>
</html>
