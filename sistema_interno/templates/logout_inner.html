{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sessão encerrada | Lazer & Sport</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;color:#f7f9fc;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 10%,rgba(102,149,255,.16),transparent 28rem),#07101d}
.box{width:min(480px,100%);padding:42px;border:1px solid #29415f;border-radius:26px;text-align:center;background:linear-gradient(180deg,#122239,#0f1b2d);box-shadow:0 32px 90px rgba(0,0,0,.45)}
.logo{width:76px;height:76px;padding:6px;border-radius:19px;object-fit:contain;background:#fff}
.ok{width:54px;height:54px;margin:26px auto 14px;display:grid;place-items:center;border-radius:50%;color:#72e2b4;background:rgba(72,214,158,.11);border:1px solid rgba(72,214,158,.22);font-size:1.4rem;font-weight:900}
h1{margin:0;font-size:1.65rem}p{margin:9px 0 25px;color:#91a5bd;font-size:.94rem;line-height:1.6}
a{height:50px;display:flex;align-items:center;justify-content:center;border:1px solid #719cff;border-radius:12px;color:#fff;background:linear-gradient(135deg,#6695ff,#4f79e8);text-decoration:none;font-size:.92rem;font-weight:900}
</style>
</head>
<body>
<main class="box">
  <img class="logo" src="{% static 'images/logoofi.png' %}" alt="Lazer & Sport">
  <div class="ok">✓</div>
  <h1>Sessão encerrada</h1>
  <p>Seu acesso à central interna foi finalizado com segurança.</p>
  <a href="{% url 'login_inner' %}">Entrar novamente</a>
</main>
</body>
</html>
