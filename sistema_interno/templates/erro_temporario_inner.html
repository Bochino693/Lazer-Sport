<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Conexão em recuperação | Lazer &amp; Sport</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:22px;display:grid;place-items:center;color:#f7efe2;background:radial-gradient(circle at 15% 10%,#263a55 0,transparent 36%),#111723}
    main{width:min(560px,100%);padding:clamp(24px,6vw,44px);border:1px solid rgba(102,177,255,.3);border-radius:24px;background:rgba(22,31,45,.94);box-shadow:0 28px 80px rgba(0,0,0,.42)}
    .icon{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;color:#8ed5ff;background:rgba(76,162,231,.14);font-size:28px}h1{margin:20px 0 8px;font-size:clamp(1.45rem,5vw,2.25rem)}p{margin:0;color:#bdc9d8;line-height:1.55}.actions{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:10px}button{min-height:46px;border:1px solid rgba(132,192,244,.3);border-radius:13px;color:#f7fbff;background:#1d87ce;font-weight:800;cursor:pointer}button+button{color:#d5e5f3;background:transparent}.id{margin-top:18px;color:#718095;font-size:.75rem}@media(max-width:430px){.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">↻</div>
    <h1>A conexão oscilou</h1>
    <p>O sistema interrompeu a operação com segurança. Nenhum formulário foi reenviado automaticamente. Aguarde alguns segundos e tente novamente.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <button type="button" onclick="history.back()">Voltar à tela anterior</button>
    </div>
    {% if request_id %}<div class="id">Referência: {{ request_id }}</div>{% endif %}
  </main>
</body>
</html>
