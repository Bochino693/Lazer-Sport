{% comment %}
  As faixas diagonais do canto da foto. Ícones desenhados aqui (não são da
  fonte de ícones): a câmera com o ponto de gravação e a pistola laser.
  `modelo` é a versão que o JavaScript copia: vai num <template>.
{% endcomment %}{% if avisos %}{% if modelo %}<template data-faixas-modelo>{% endif %}<span class="ls-faixas" role="img" aria-label="{% for aviso in avisos %}{{ aviso.texto }}{% if not forloop.last %} e {% endif %}{% endfor %}">{% for aviso in avisos %}<span class="ls-faixa ls-faixa--{{ aviso.id }}" data-aviso="{{ aviso.id }}">{% if aviso.id == "camera" %}<svg class="ls-faixa-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.2 7.2h2.9l1.5-2.1h6.8l1.5 2.1h2.9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4.2a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="currentColor"/><circle cx="12" cy="13.6" r="4.6" fill="#081128"/><circle cx="12" cy="13.6" r="2.9" fill="#3fd0ff"/><circle cx="10.9" cy="12.5" r="1" fill="#fff"/><circle cx="18.7" cy="9.8" r="1.15" fill="#ff2d3d"/></svg>{% else %}<svg class="ls-faixa-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M1.8 8.4h13.4l1.9-1.6h3.4v4.6h-2.3l-1 1.1h-4.4l-1.5 1.1.9 4.6a1.1 1.1 0 0 1-1.1 1.3H8.3a1.1 1.1 0 0 1-1.1-.9l-.9-4.7H3.8a2 2 0 0 1-2-2z" fill="currentColor"/><rect x="4.4" y="9.6" width="6.6" height="1.5" rx=".75" fill="#081128"/><circle cx="13.6" cy="10.4" r="1" fill="#3fd0ff"/><path d="M21.2 9.1h2" stroke="#ff2d3d" stroke-width="1.8" stroke-linecap="round"/><path d="M19.4 4.2l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5z" fill="#fff"/></svg>{% endif %}<b class="ls-faixa-texto">{{ aviso.texto }}</b><b class="ls-faixa-curto">{{ aviso.curto }}</b></span>{% endfor %}</span>{% if modelo %}</template>{% endif %}{% endif %}
