{% extends "base.html" %}
{% load static interno_extras %}

{% block title %}Até logo! — Lazer & Sports{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% estatico 'site/paginas/logout_sucesso.css' %}">

<div class="logout-box" id="logout-box">

    <!-- Mascote animado -->
    <img src="{% static 'images/mascotepp.png' %}" class="logout-mascot" alt="Mascote">

    <h2>Você saiu da sua conta</h2>
    <p>Obrigado por visitar a Lazer & Sports!<br>Volte sempre 🎯</p>

    <!-- Barra de progresso -->
    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>

    <p style="margin-top:10px; font-size: 0.9em; color: var(--sub);">
        Redirecionando em 4 segundos...
    </p>
</div>

<!-- Redirecionamento -->
<script>
    setTimeout(function() {
        window.location.href = "{% url 'home' %}";
    }, 4000);
</script>

{% endblock %}
