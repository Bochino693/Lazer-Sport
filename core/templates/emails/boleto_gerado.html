{% load interno_extras %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boleto do pedido #{{ pedido.id }}</title>
</head>
{# Tabelas e estilo inline: cliente de e-mail não roda flex/grid nem <style> externo. #}
<body style="margin:0; padding:0; background:#f2f5fb; font-family:'Segoe UI',Arial,Helvetica,sans-serif; color:#2c3e50;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
    Seu boleto de R$ {{ total }} vence em {{ vencimento }}. O pedido #{{ pedido.id }} fica reservado até lá.
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f5fb; padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:600px; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 8px 28px rgba(0,74,173,.12);">
          <tr>
            <td style="background:linear-gradient(90deg,#004AAD,#7a3cff); padding:28px 30px; text-align:center;">
              <h1 style="margin:0 0 4px; color:#ffffff; font-size:23px; font-weight:800;">Seu boleto está pronto</h1>
              <p style="margin:0; color:#e3e9ff; font-size:15px;">Pedido #{{ pedido.id }} &middot; vence em {{ vencimento }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:26px 30px 6px;">
              <p style="margin:0 0 14px; font-size:16px; line-height:1.6;">
                Olá, <strong>{{ primeiro_nome }}</strong>! O seu pedido fica reservado até o vencimento.
                Assim que o banco confirmar o pagamento (de 1 a 3 dias úteis), avisamos por aqui.
              </p>
              <p style="margin:0 0 6px; font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#7b8aa0;">Valor</p>
              <p style="margin:0 0 18px; font-size:24px; font-weight:800; color:#004AAD;">R$ {{ total }}</p>
              {% if pedido.boleto_linha %}
              <p style="margin:0 0 6px; font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#7b8aa0;">Linha digitável</p>
              <p style="margin:0 0 18px; padding:12px 14px; background:#f6f9ff; border-radius:10px; font-family:Consolas,monospace; font-size:15px; word-break:break-all;">{{ pedido.boleto_linha }}</p>
              {% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding:6px 30px 28px; text-align:center;">
              <a href="{{ pedido.boleto_url }}"
                 style="display:inline-block; padding:15px 34px; background:#004AAD; color:#ffffff; font-size:16px; font-weight:700; text-decoration:none; border-radius:10px;">
                Abrir o boleto
              </a>
              <p style="margin:16px 0 0; font-size:14px; color:#61708a;">
                Acompanhe em <a href="{{ url_pedidos }}" style="color:#004AAD;">Meus pedidos</a>.
                Dúvidas? <a href="{{ whatsapp }}" style="color:#004AAD;">Fale no WhatsApp</a>.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
