{# O período da tela: o mês (setas) e os chips dos períodos dos cartões do relógio já importados. #}
<nav class="rh-periodo" aria-label="Período">
  <div class="rh-mes">
    <a class="rh-mes-seta" href="?mes={{ periodo.anterior }}" aria-label="Mês anterior"><i class="bi bi-chevron-left" aria-hidden="true"></i></a>
    <strong>{{ periodo.texto|capfirst }}</strong>
    <a class="rh-mes-seta" href="?mes={{ periodo.seguinte }}" aria-label="Mês seguinte"><i class="bi bi-chevron-right" aria-hidden="true"></i></a>
  </div>
  {% if importados %}
    <div class="rh-chips rh-chips--periodos" role="group" aria-label="Períodos dos cartões importados">
      {% for p in importados %}
        <a class="rh-chip{% if p.de == periodo.de and p.ate == periodo.ate %} is-ativo{% endif %}" href="?{{ p.query }}"><i class="bi bi-file-earmark-check" aria-hidden="true"></i> {{ p.texto }}</a>
      {% endfor %}
    </div>
  {% endif %}
</nav>
